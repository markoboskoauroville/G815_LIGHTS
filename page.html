<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock">
<title>G815 Lights</title>
<!-- The CAMERA language (MANTRA_MANIFEST modules/language-camera.md): words, not boxes; green = on,
     grey = off, amber = armed. The one exception, written to its Discoveries: on the keyboard drawing
     colour is the CONTENT (each key's own colour), so selection is shown by an amber ring, never by a
     colour of its own. -->
<style>
  :root { --ground:#0B0D10; --surface:#12161B; --sand:#F2DDB4; --dim:rgba(242,221,180,.45);
          --green:#33D17A; --grey:#7A8087; --amber:#E8A33D; --dark:#33383E; --red:#FF3B30; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--sand); font:13px/1.45 Menlo,"SF Mono",monospace;
         padding:18px 22px 40px; user-select:none; -webkit-user-select:none; }
  .top { display:flex; align-items:baseline; gap:18px; }
  h1 { font-size:14px; letter-spacing:.2em; margin:0; font-weight:700; }
  .whisper { color:var(--dim); font-size:11px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-right:6px; }
  .dot.on { background:var(--green); }
  .w { font:inherit; font-weight:700; letter-spacing:.04em; background:none; border:0; color:var(--grey);
       cursor:pointer; padding:4px 6px; }
  .w:hover { color:var(--sand); }
  .w.on { color:var(--green); }
  .w.armed { color:var(--amber); }
  .w.dead { color:var(--dark); cursor:default; }
  .label { color:var(--dim); font-size:10px; letter-spacing:.16em; margin:0 0 6px; }
  #board { position:relative; margin:18px 0 14px; background:var(--surface); border-radius:10px; }
  .key { position:absolute; border-radius:5px; display:flex; align-items:center; justify-content:center;
         font-size:10px; font-weight:700; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
  .key.sel { box-shadow:0 0 0 2px var(--amber); z-index:2; }
  .bar { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .cols { display:grid; grid-template-columns:330px 1fr; gap:26px; }
  .panel { margin-bottom:16px; }
  canvas { display:block; border-radius:6px; cursor:crosshair; }
  .pick { display:flex; gap:10px; }
  .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px 10px; margin-top:10px; }
  .nums label { color:var(--dim); font-size:10px; display:flex; align-items:center; gap:5px; }
  input[type=number], input[type=text] { font:inherit; color:var(--sand); background:var(--ground); width:62px;
         border:1px solid var(--dark); border-radius:5px; padding:3px 5px; }
  input[type=text] { width:110px; }
  input:focus { outline:none; border-color:var(--amber); }
  .swatches { display:flex; gap:6px; margin-top:10px; }
  .sw { width:24px; height:24px; border-radius:5px; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .fader { display:flex; align-items:center; gap:12px; }
  .fader input[type=range] { flex:1; accent-color:var(--sand); }
  .fader .val { font-size:15px; font-weight:700; width:48px; text-align:right; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 4px 3px 6px; cursor:pointer; color:var(--grey); font-weight:700; }
  .chip:hover { color:var(--sand); }
  .chip .sw { width:14px; height:14px; border-radius:3px; cursor:pointer; }
  .chip .x { color:var(--dark); padding:0 4px; }
  .chip .x:hover { color:var(--red); }
  .chip.on { color:var(--green); }
  .said { color:var(--dim); font-size:11px; margin-top:4px; min-height:16px; }
</style></head><body>

<div class="top">
  <h1>G815 LIGHTS</h1>
  <span class="whisper" id="status"><span class="dot"></span>looking for the keyboard</span>
  <span style="flex:1"></span>
  <span class="whisper" id="ver"></span>
</div>

<div id="board"></div>

<div class="bar">
  <span class="label" style="margin:0 6px 0 0">KEYS</span>
  <button class="w" onclick="selectAll()">ALL</button>
  <button class="w" onclick="selectNone()">NONE</button>
  <button class="w" onclick="selectSame()">SAME COLOUR</button>
  <span class="whisper" id="selcount" style="margin-left:10px"></span>
</div>

<div class="cols" style="margin-top:16px">
  <div>
    <div class="panel">
      <div class="label">COLOUR</div>
      <div class="pick">
        <canvas id="sv" width="270" height="170"></canvas>
        <canvas id="hue" width="28" height="170"></canvas>
      </div>
      <div class="nums">
        <label>R <input type="number" id="r" min="0" max="255"></label>
        <label>G <input type="number" id="g" min="0" max="255"></label>
        <label>B <input type="number" id="b" min="0" max="255"></label>
        <label>H <input type="number" id="h" min="0" max="360"></label>
        <label>S <input type="number" id="s" min="0" max="100"></label>
        <label>V <input type="number" id="v" min="0" max="100"></label>
        <label>HEX <input type="text" id="hex" style="width:76px" maxlength="7"></label>
      </div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="panel">
      <div class="label">KEY BRIGHTNESS</div>
      <div class="fader"><input type="range" id="kb" min="0" max="100"><span class="val" id="kbv"></span></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="label">PRESETS</div>
      <div class="bar" id="presets"></div>
      <div class="bar" style="margin-top:6px">
        <input type="text" id="pname" placeholder="name" maxlength="16">
        <button class="w" onclick="presetSave()">+ PRESET</button>
      </div>
    </div>
    <div class="panel">
      <div class="label">MEMORIES</div>
      <div class="bar" id="memories"></div>
      <div class="bar" style="margin-top:6px">
        <input type="text" id="mname" maxlength="24">
        <button class="w" onclick="verb({a:'memoryName', name:val('mname')})">RENAME</button>
        <button class="w" onclick="verb({a:'memoryNew'})">+ NEW</button>
        <button class="w" id="mdel" onclick="memDelete()">DELETE</button>
      </div>
    </div>
    <div class="panel">
      <div class="label">KEYBOARD BRIGHTNESS</div>
      <div class="fader"><input type="range" id="gb" min="0" max="100"><span class="val" id="gbv"></span></div>
    </div>
    <div class="panel">
      <div class="label">POWER-ON (THE KEYBOARD'S OWN MEMORY, M1 M2 M3)</div>
      <div class="bar">
        <span class="whisper">KEYS</span><span class="sw" id="pk" style="width:18px;height:18px"></span>
        <span class="whisper" style="margin-left:8px">LOGO</span><span class="sw" id="pl" style="width:18px;height:18px"></span>
        <button class="w" id="write" onclick="write_()" style="margin-left:10px">WRITE</button>
        <button class="w" onclick="verb({a:'repaint'})">PAINT AGAIN</button>
      </div>
      <div class="said" id="said"></div>
    </div>
  </div>
</div>

<script>
let S = null, L = null, sel = new Set(), hsv = [0, 0, 1], keyB = 100, armedDel = false, armedWrite = false;
const $ = id => document.getElementById(id);
const val = id => $(id).value;

async function verb(v) {
  const r = await fetch('/do', { method: 'POST', body: JSON.stringify(v) });
  S = await r.json(); draw();
}

// ---------------------------------------------------------------- colour maths
function hsv2rgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
}
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx];
}
const hex2rgb = h => [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
const rgb2hex = c => c.map(x => x.toString(16).padStart(2, '0')).join('');
const shown = k => { const c = hex2rgb(k.c), f = k.b / 100; return rgb2hex(c.map(x => Math.round(x * f))); };

// ---------------------------------------------------------------- the keyboard
let U = 46;
function build() {
  const board = $('board'), pad = 14;
  U = Math.max(30, Math.min(56, (board.clientWidth - 2 * pad) / L.w));
  board.style.height = (L.h * U + 2 * pad) + 'px';
  board.innerHTML = '';
  for (const k of L.keys) {
    const d = document.createElement('div');
    d.className = 'key'; d.id = 'k' + k.id; d.textContent = k.l;
    Object.assign(d.style, { left: (pad + k.x * U + 2) + 'px', top: (pad + k.y * U + 2) + 'px',
      width: (k.w * U - 4) + 'px', height: (k.h * U - 4) + 'px' });
    d.onmousedown = e => { dragAdd = !sel.has(k.id); dragging = true; toggle(k.id, dragAdd); e.preventDefault(); };
    d.onmouseenter = () => { if (dragging) toggle(k.id, dragAdd); };
    board.appendChild(d);
  }
}
let dragging = false, dragAdd = true;
window.onmouseup = () => { if (dragging) { dragging = false; pickFromSelection(); } };

function toggle(id, on) { on ? sel.add(id) : sel.delete(id); drawKeys(); }
function selectAll() { L.keys.forEach(k => sel.add(k.id)); drawKeys(); pickFromSelection(); }
function selectNone() { sel.clear(); drawKeys(); }
function selectSame() {
  if (!sel.size) return;
  const first = S.keys[[...sel][0]];
  for (const k of L.keys) { const o = S.keys[k.id]; if (o.c === first.c && o.b === first.b) sel.add(k.id); }
  drawKeys();
}
// the picker takes the colour of what was chosen, so a key can be read before it is changed
function pickFromSelection() {
  if (!sel.size) return;
  const k = S.keys[[...sel][0]];
  hsv = rgb2hsv(...hex2rgb(k.c)); keyB = k.b; drawPicker();
}

function drawKeys() {
  for (const k of L.keys) {
    const d = $('k' + k.id), o = S.keys[k.id], c = shown(o), [r, g, b] = hex2rgb(c);
    d.style.background = '#' + c;
    d.style.color = (0.3 * r + 0.59 * g + 0.11 * b) > 120 ? '#0B0D10' : 'rgba(242,221,180,.7)';
    d.classList.toggle('sel', sel.has(k.id));
  }
  $('selcount').textContent = sel.size ? sel.size + ' chosen' : 'click or drag across keys';
}

// ---------------------------------------------------------------- the picker
const sv = $('sv'), hue = $('hue');
function drawPicker() {
  const [h, s, v] = hsv, x = sv.getContext('2d'), W = sv.width, H = sv.height;
  x.fillStyle = 'rgb(' + hsv2rgb(h, 1, 1) + ')'; x.fillRect(0, 0, W, H);
  let g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = v > .5 ? '#000' : '#fff'; x.lineWidth = 2;
  x.beginPath(); x.arc(s * W, (1 - v) * H, 6, 0, 7); x.stroke();
  const y = hue.getContext('2d');
  for (let i = 0; i < hue.height; i++) { y.fillStyle = 'rgb(' + hsv2rgb(i / hue.height * 360, 1, 1) + ')'; y.fillRect(0, i, hue.width, 1); }
  y.strokeStyle = '#fff'; y.lineWidth = 2; y.strokeRect(1, h / 360 * hue.height - 2, hue.width - 2, 4);
  const rgb = hsv2rgb(h, s, v);
  if (document.activeElement.tagName !== 'INPUT' || document.activeElement.type === 'range') {
    $('r').value = rgb[0]; $('g').value = rgb[1]; $('b').value = rgb[2];
    $('h').value = Math.round(h); $('s').value = Math.round(s * 100); $('v').value = Math.round(v * 100);
    $('hex').value = '#' + rgb2hex(rgb).toUpperCase();
  }
  $('kb').value = keyB; $('kbv').textContent = keyB + '%';
}
function drag(el, fn) {
  let on = false;
  const at = e => { const r = el.getBoundingClientRect(); fn(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))); };
  el.onmousedown = e => { on = true; at(e); };
  window.addEventListener('mousemove', e => { if (on) at(e); });
  window.addEventListener('mouseup', () => { if (on) { on = false; send(true); } });
}
drag(sv, (x, y) => { hsv[1] = x; hsv[2] = 1 - y; drawPicker(); send(); });
drag(hue, (x, y) => { hsv[0] = Math.min(359.9, y * 360); drawPicker(); send(); });
for (const id of ['r', 'g', 'b']) $(id).oninput = () => { hsv = rgb2hsv(+$('r').value || 0, +$('g').value || 0, +$('b').value || 0); drawPicker(); send(); };
for (const id of ['h', 's', 'v']) $(id).oninput = () => { hsv = [(+$('h').value || 0) % 360, (+$('s').value || 0) / 100, (+$('v').value || 0) / 100]; drawPicker(); send(); };
$('hex').oninput = () => { const m = $('hex').value.replace('#', ''); if (/^[0-9a-f]{6}$/i.test(m)) { hsv = rgb2hsv(...hex2rgb(m)); drawPicker(); send(); } };
$('kb').oninput = () => { keyB = +$('kb').value; drawPicker(); send(); };
$('kb').onchange = () => send(true);
for (const c of ['000000', 'ff0000', 'ffff00', '00ff00', '00ffff', '0000ff', 'ff00ff', 'ffffff']) {
  const d = document.createElement('div'); d.className = 'sw'; d.style.background = '#' + c;
  d.onclick = () => { hsv = rgb2hsv(...hex2rgb(c)); drawPicker(); send(true); };
  $('swatches').appendChild(d);
}

// live: the keyboard follows the hand, at most every 60 ms, and the last value always lands
let timer = null;
function send(now) {
  if (!sel.size) return;
  const v = { a: 'paint', ids: [...sel], c: rgb2hex(hsv2rgb(...hsv)), b: keyB };
  for (const id of sel) S.keys[id] = { c: v.c, b: v.b };
  drawKeys();
  clearTimeout(timer);
  timer = setTimeout(() => verb(v), now ? 0 : 60);
}

// ---------------------------------------------------------------- presets, memories, brightness, power-on
function presetSave() { verb({ a: 'presetSave', name: val('pname'), c: rgb2hex(hsv2rgb(...hsv)), b: keyB }); $('pname').value = ''; }
function memDelete() {
  if (!armedDel) { armedDel = true; $('mdel').classList.add('armed'); $('mdel').textContent = 'DELETE?'; setTimeout(() => { armedDel = false; draw(); }, 3000); return; }
  armedDel = false; verb({ a: 'memoryDelete' });
}
function write_() {
  if (!armedWrite) { armedWrite = true; $('write').classList.add('armed'); $('write').textContent = 'WRITE?'; setTimeout(() => { armedWrite = false; draw(); }, 3000); return; }
  armedWrite = false; verb({ a: 'write' });
}
$('gb').oninput = () => { $('gbv').textContent = $('gb').value + '%'; };
$('gb').onchange = () => verb({ a: 'bright', v: +$('gb').value });

function chip(cls, color, name, onClick, onX) {
  const c = document.createElement('span'); c.className = 'chip ' + cls; c.onclick = onClick;
  if (color) { const s = document.createElement('span'); s.className = 'sw'; s.style.background = '#' + color; c.appendChild(s); }
  c.appendChild(document.createTextNode(name));
  if (onX) { const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.onclick = e => { e.stopPropagation(); onX(); }; c.appendChild(x); }
  return c;
}

function draw() {
  if (!S || !L) return;
  drawKeys();
  const lv = S.live;
  $('status').innerHTML = '<span class="dot' + (lv.connected ? ' on' : '') + '"></span>' +
    (lv.connected ? 'G815 ' + lv.serial + ' · onboard M' + lv.profile : 'not connected' + (lv.error ? ' — ' + lv.error : ''));
  $('ver').textContent = 'v' + S.version;
  const P = $('presets'); P.innerHTML = '';
  S.presets.forEach((p, i) => P.appendChild(chip('', shown(p), p.name + (p.b < 100 ? ' ' + p.b + '%' : ''),
    () => { hsv = rgb2hsv(...hex2rgb(p.c)); keyB = p.b; drawPicker(); send(true); },
    () => verb({ a: 'presetDelete', i: i + 1 }))));
  const Mm = $('memories'); Mm.innerHTML = '';
  S.memories.forEach((n, i) => Mm.appendChild(chip(i + 1 === S.active ? 'on' : '', null, n, () => verb({ a: 'memory', i: i + 1 }))));
  if (document.activeElement !== $('mname')) $('mname').value = S.memories[S.active - 1];
  $('mdel').className = 'w' + (S.memories.length > 1 ? (armedDel ? ' armed' : '') : ' dead');
  if (!armedDel) $('mdel').textContent = 'DELETE';
  if (document.activeElement !== $('gb') && lv.brightness != null) { $('gb').value = lv.brightness; $('gbv').textContent = lv.brightness + '%'; }
  $('pk').style.background = '#' + S.power.keys; $('pl').style.background = '#' + S.power.logo;
  $('write').className = 'w' + (armedWrite ? ' armed' : '');
  if (!armedWrite) $('write').textContent = 'WRITE';
  $('said').textContent = lv.said || '';
}

(async () => {
  L = await (await fetch('/layout.json')).json();
  S = await (await fetch('/state')).json();
  build(); draw(); drawPicker();
  window.onresize = () => { build(); drawKeys(); };
  setInterval(async () => { if (dragging) return; const s = await (await fetch('/state')).json(); S.live = s.live; S.power = s.power; draw(); }, 2000);
})();
</script>
</body></html>
